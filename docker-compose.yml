version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriopus-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: nutriopus
      POSTGRES_PASSWORD: nutriopus
      POSTGRES_DB: nutriopus
    volumes:
      - nutriopus_pgdata:/var/lib/postgresql/data

volumes:
  nutriopus_pgdata:
