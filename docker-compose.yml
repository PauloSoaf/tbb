name: tbb
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5440:5432'
    environment:
      POSTGRES_USER: tbb
      POSTGRES_PASSWORD: ${TBB_DB_PASSWORD:?Set TBB_DB_PASSWORD in .env}
      POSTGRES_DB: tbb
    volumes:
      - tbb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbb -d tbb"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  tbb_pgdata:
