name: ${COMPOSE_PROJECT_NAME:-nutriopus-transcription}

x-speaches-environment: &speaches-environment
  API_KEY: ${SPEACHES_API_KEY:?Set SPEACHES_API_KEY in infra/transcription/.env}
  ALLOW_ORIGINS: '${SPEACHES_ALLOW_ORIGINS:-[]}'
  ENABLE_UI: ${SPEACHES_ENABLE_UI:-false}
  LOG_LEVEL: ${SPEACHES_LOG_LEVEL:-info}
  PRELOAD_MODELS: '${SPEACHES_PRELOAD_MODELS:-["deepdml/faster-whisper-large-v3-turbo-ct2","Systran/faster-whisper-small"]}'
  STT_MODEL_TTL: ${SPEACHES_STT_MODEL_TTL_SECONDS:-900}
  HF_TOKEN: ${HF_TOKEN:-}
  DO_NOT_TRACK: "1"
  DISABLE_TELEMETRY: "1"
  GRADIO_ANALYTICS_ENABLED: "False"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYANNOTE_METRICS_ENABLED: "0"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${SPEACHES_OTEL_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${SPEACHES_OTEL_SERVICE_NAME:-nutriopus-speaches}

x-speaches-common: &speaches-common
  restart: unless-stopped
  expose:
    - "8000"
  volumes:
    - speaches-hf-cache:/home/ubuntu/.cache/huggingface/hub
  networks:
    transcription:
      aliases:
        - speaches
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: ${SPEACHES_HEALTH_START_PERIOD:-15m}
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

x-gateway-environment: &gateway-environment
  NODE_ENV: ${NODE_ENV:-development}
  GATEWAY_HOST: 0.0.0.0
  GATEWAY_PORT: 8080
  GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
  GATEWAY_ALLOWED_ORIGINS: '${GATEWAY_ALLOWED_ORIGINS:-["http://localhost:3000"]}'
  GATEWAY_REQUIRE_ORIGIN: ${GATEWAY_REQUIRE_ORIGIN:-true}
  GATEWAY_ALLOW_QUERY_TOKEN: ${GATEWAY_ALLOW_QUERY_TOKEN:-false}
  GATEWAY_TRUST_PROXY: ${GATEWAY_TRUST_PROXY:-false}
  GATEWAY_TOKEN_ISSUER: ${GATEWAY_TOKEN_ISSUER:-nutriopus}
  GATEWAY_TOKEN_AUDIENCE: ${GATEWAY_TOKEN_AUDIENCE:-transcription-gateway}
  GATEWAY_TOKEN_MAX_TTL_SECONDS: ${GATEWAY_TOKEN_MAX_TTL_SECONDS:-120}
  GATEWAY_TOKEN_CLOCK_SKEW_SECONDS: ${GATEWAY_TOKEN_CLOCK_SKEW_SECONDS:-5}
  GATEWAY_TOKEN_SINGLE_USE: ${GATEWAY_TOKEN_SINGLE_USE:-true}
  GATEWAY_MAX_CONNECTIONS_PER_IP: ${GATEWAY_MAX_CONNECTIONS_PER_IP:-4}
  GATEWAY_MAX_MESSAGE_BYTES: ${GATEWAY_MAX_MESSAGE_BYTES:-262144}
  GATEWAY_MAX_AUDIO_CHUNK_BYTES: ${GATEWAY_MAX_AUDIO_CHUNK_BYTES:-131072}
  GATEWAY_MAX_MESSAGES_PER_SECOND: ${GATEWAY_MAX_MESSAGES_PER_SECOND:-20}
  GATEWAY_MAX_BYTES_PER_SECOND: ${GATEWAY_MAX_BYTES_PER_SECOND:-1048576}
  GATEWAY_MAX_PENDING_BYTES: ${GATEWAY_MAX_PENDING_BYTES:-524288}
  GATEWAY_IDLE_TIMEOUT_SECONDS: ${GATEWAY_IDLE_TIMEOUT_SECONDS:-45}
  GATEWAY_MAX_SESSION_SECONDS: ${GATEWAY_MAX_SESSION_SECONDS:-14400}
  GATEWAY_HEARTBEAT_INTERVAL_SECONDS: ${GATEWAY_HEARTBEAT_INTERVAL_SECONDS:-20}
  GATEWAY_UPSTREAM_CONNECT_TIMEOUT_MS: ${GATEWAY_UPSTREAM_CONNECT_TIMEOUT_MS:-15000}
  GATEWAY_METRICS_BEARER_TOKEN: ${GATEWAY_METRICS_BEARER_TOKEN:-}
  TRANSCRIPTION_GATEWAY_HMAC_SECRET: ${TRANSCRIPTION_GATEWAY_HMAC_SECRET:?Set TRANSCRIPTION_GATEWAY_HMAC_SECRET in infra/transcription/.env}
  TRANSCRIPTION_DEFAULT_MODEL: ${TRANSCRIPTION_DEFAULT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
  TRANSCRIPTION_FALLBACK_MODEL: ${TRANSCRIPTION_FALLBACK_MODEL:-Systran/faster-whisper-small}
  TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-pt}
  TRANSCRIPTION_ALLOWED_MODELS: '${TRANSCRIPTION_ALLOWED_MODELS:-["deepdml/faster-whisper-large-v3-turbo-ct2","Systran/faster-whisper-small"]}'
  SPEACHES_WS_URL: ws://speaches:8000/v1/realtime
  SPEACHES_HEALTH_URL: http://speaches:8000/health
  SPEACHES_API_KEY: ${SPEACHES_API_KEY:?Set SPEACHES_API_KEY in infra/transcription/.env}

x-gateway-common: &gateway-common
  build:
    context: ./gateway
    dockerfile: Dockerfile
  restart: unless-stopped
  ports:
    - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PUBLIC_PORT:-8001}:8080"
  expose:
    - "8080"
  networks:
    transcription:
      aliases:
        - transcription-gateway
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 20s
  stop_grace_period: 20s

services:
  speaches-cpu:
    <<: *speaches-common
    profiles: ["cpu"]
    image: ${SPEACHES_CPU_RUNTIME_IMAGE:-nutriopus-speaches:0.9.0-rc.3-cpu-fastapi117}
    build:
      context: ./speaches
      dockerfile: Dockerfile
      args:
        SPEACHES_BASE_IMAGE: ${SPEACHES_CPU_IMAGE:-ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu}
        SPEACHES_FASTAPI_VERSION: ${SPEACHES_FASTAPI_VERSION:-0.117.1}
    environment:
      <<: *speaches-environment
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: ${SPEACHES_CPU_COMPUTE_TYPE:-int8}
      WHISPER__CPU_THREADS: ${SPEACHES_CPU_THREADS:-0}
      WHISPER__NUM_WORKERS: ${SPEACHES_CPU_WORKERS:-1}

  transcription-gateway-cpu:
    <<: *gateway-common
    profiles: ["cpu"]
    environment:
      <<: *gateway-environment
    depends_on:
      speaches-cpu:
        condition: service_healthy

  speaches-gpu:
    <<: *speaches-common
    profiles: ["gpu"]
    image: ${SPEACHES_GPU_RUNTIME_IMAGE:-nutriopus-speaches:0.9.0-rc.3-cuda-fastapi117}
    build:
      context: ./speaches
      dockerfile: Dockerfile
      args:
        SPEACHES_BASE_IMAGE: ${SPEACHES_GPU_IMAGE:-ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda}
        SPEACHES_FASTAPI_VERSION: ${SPEACHES_FASTAPI_VERSION:-0.117.1}
    environment:
      <<: *speaches-environment
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: ${SPEACHES_GPU_COMPUTE_TYPE:-float16}
      WHISPER__DEVICE_INDEX: ${SPEACHES_GPU_DEVICE_INDEX:-0}
      WHISPER__NUM_WORKERS: ${SPEACHES_GPU_WORKERS:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  transcription-gateway-gpu:
    <<: *gateway-common
    profiles: ["gpu"]
    environment:
      <<: *gateway-environment
    depends_on:
      speaches-gpu:
        condition: service_healthy

networks:
  transcription:
    driver: bridge

volumes:
  speaches-hf-cache:
    name: ${SPEACHES_MODEL_CACHE_VOLUME:-nutriopus-speaches-model-cache}
